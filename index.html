<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

let equipos = [];

const VERSION = "1.0.0";
const AUTOR = "Dania Estefania Rubio Benitez";
const FECHA_VERSION = "03/11/2026";

const supabaseUrl = "https://mkkqczcfsmqtomtturen.supabase.co";

const supabaseKey = "PEGA_AQUI_TU_PUBLISHABLE_KEY_COMPLETA";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

window.onload = function () {

    actualizarHora();

    setInterval(actualizarHora, 1000);

    cargarEquipos();

};

async function cargarEquipos() {

    document.getElementById("contador").innerText =
        "Cargando base de datos...";

    const { data, error } = await supabase
        .from("equipos")
        .select("*");

    if (error) {

        console.error(error);

        document.getElementById("contador").innerText =
            "Error cargando la base de datos";

        return;
    }

    equipos = data.map(item => ({
        nombre: item.Nombre || "",
        ip: item.IP || "",
        sdseb: item["SDS-EB"] || ""
    }));

    document.getElementById("contador").innerText =
        "Base cargada correctamente";

    document.getElementById("totalEquipos").innerText =
        "Total de equipos cargados: " + equipos.length;
}

function actualizarHora() {

    const ahora = new Date();

    document.getElementById("fechaHora").innerText =
        ahora.toLocaleString("es-CO");

}

document
.getElementById("buscar")
.addEventListener("keydown", function (event) {

    if (event.key === "Enter") {

        event.preventDefault();

        filtrar();

    }

});

function mostrar(lista) {

    let html = "";

    lista.forEach(item => {

        html += `
        <tr>
            <td>${item.nombre}</td>
            <td>
                ${item.ip}
                <button
                    class="btn"
                    onclick="copiarIP('${item.ip}')">
                    Copiar
                </button>
            </td>
            <td>${item.sdseb}</td>
        </tr>
        `;

    });

    document.getElementById("tabla").innerHTML = html;

}

function filtrar() {

    const texto =
        document.getElementById("buscar")
        .value
        .toLowerCase()
        .trim();

    if (texto.length < 3) {

        document.getElementById("tabla").innerHTML = "";

        document.getElementById("contador").innerText =
            "Escriba mínimo 3 caracteres para buscar";

        document.getElementById("resultadosVisibles").innerText =
            "";

        return;

    }

    const resultado = equipos.filter(item =>

        item.nombre.toLowerCase().includes(texto)

        ||

        item.ip.toLowerCase().includes(texto)

        ||

        item.sdseb.toLowerCase().includes(texto)

    );

    mostrar(resultado.slice(0, 100));

    document.getElementById("contador").innerText =
        "Resultados encontrados: " + resultado.length;

    document.getElementById("resultadosVisibles").innerText =
        "Mostrando " +
        Math.min(resultado.length, 100) +
        " de " +
        resultado.length +
        " registros";

}

function copiarIP(ip) {

    navigator.clipboard.writeText(ip);

    document.getElementById("contador").innerText =
        "IP copiada correctamente: " + ip;

}

function volverInicio() {

    document.getElementById("buscar").value = "";

    document.getElementById("tabla").innerHTML = "";

    document.getElementById("contador").innerText =
        "Ingrese un criterio de búsqueda.";

    document.getElementById("resultadosVisibles").innerText =
        "";

}

function cambiarTema() {

    document.body.classList.toggle("tema-oscuro");

    const boton = document.querySelector(
        'button[onclick="cambiarTema()"]'
    );

    if (document.body.classList.contains("tema-oscuro")) {

        boton.innerHTML = "☀️ Modo Claro";

    } else {

        boton.innerHTML = "🌙 Modo Oscuro";

    }

}

function exportarCSV() {

    let texto = "Nombre;IP;SDS-EB\n";

    const filas =
        document.querySelectorAll("#tabla tr");

    filas.forEach(fila => {

        const columnas =
            fila.querySelectorAll("td");

        if (columnas.length >= 3) {

            texto +=
                columnas[0].innerText + ";" +
                columnas[1].innerText.replace("Copiar", "").trim() + ";" +
                columnas[2].innerText +
                "\n";

        }

    });

    const blob =
        new Blob([texto], { type: "text/csv" });

    const enlace =
        document.createElement("a");

    enlace.href =
        URL.createObjectURL(blob);

    enlace.download =
        "Resultados_KouFrontEmpresas.csv";

    enlace.click();

}

function limpiarBusqueda() {

    document.getElementById("buscar").value = "";

    document.getElementById("tabla").innerHTML = "";

}

</script>
